<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consolidation Crush - 連結会計パズル</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .game-container {
            display: flex;
            gap: 30px;
            padding: 20px;
        }

        .side-panel {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .panel-box h3 {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 32px;
            font-weight: bold;
            color: #64ffda;
        }

        .level-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd93d;
        }

        .next-preview {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .preview-block {
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }

        .game-board-container {
            position: relative;
        }

        .game-board {
            width: 360px;
            height: 600px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            border: 3px solid #64ffda;
            position: relative;
            overflow: hidden;
        }

        .block {
            position: absolute;
            width: 70px;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.1s ease;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .block .company {
            font-size: 10px;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .block .account {
            font-size: 11px;
            line-height: 1.2;
        }

        /* P社ブロック（青系） */
        .block.p-company {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid #a78bfa;
        }

        /* S社ブロック（緑系） */
        .block.s-company {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: 2px solid #6ee7b7;
        }

        /* 特殊ブロック */
        .block.investment {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: 2px solid #fbbf24;
        }

        .block.equity {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: 2px solid #22d3ee;
        }

        .block.goodwill {
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            border: 2px solid #fff;
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px #ffd700; }
            to { box-shadow: 0 0 20px #ff8c00, 0 0 30px #ffd700; }
        }

        .elimination-effect {
            position: absolute;
            pointer-events: none;
            font-size: 24px;
            font-weight: bold;
            color: #64ffda;
            text-shadow: 0 0 10px #64ffda;
            animation: eliminate 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes eliminate {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(2) translateY(-30px); opacity: 0; }
        }

        .combo-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 20px #ff8c00;
            animation: combo 1s ease-out forwards;
            z-index: 100;
            pointer-events: none;
        }

        @keyframes combo {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) translateY(-50px); opacity: 0; }
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #64ffda 0%, #38ef7d 100%);
            color: #1a1a2e;
        }

        .btn-pause {
            background: linear-gradient(135deg, #ffd93d 0%, #ff8c00 100%);
            color: #1a1a2e;
        }

        .btn-start:hover, .btn-pause:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(100, 255, 218, 0.4);
        }

        .legend {
            font-size: 11px;
            line-height: 1.8;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .instructions {
            font-size: 11px;
            line-height: 1.6;
            color: #8892b0;
        }

        .instructions kbd {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .game-over-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-over-overlay h2 {
            font-size: 36px;
            color: #f5576c;
            margin-bottom: 20px;
        }

        .game-over-overlay p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
        }

        .title h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #64ffda 0%, #ffd93d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title p {
            font-size: 12px;
            color: #8892b0;
            margin-top: 5px;
        }

        .elimination-log {
            max-height: 150px;
            overflow-y: auto;
            font-size: 10px;
        }

        .log-entry {
            padding: 5px;
            margin-bottom: 3px;
            background: rgba(100, 255, 218, 0.1);
            border-radius: 4px;
            border-left: 3px solid #64ffda;
        }

        .log-entry.goodwill {
            border-left-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="side-panel">
            <div class="title">
                <h1>Consolidation Crush</h1>
                <p>連結会計：消去仕訳パズル</p>
            </div>

            <div class="panel-box">
                <h3>スコア</h3>
                <div class="score-value" id="score">0</div>
            </div>

            <div class="panel-box">
                <h3>レベル</h3>
                <div class="level-value" id="level">1</div>
            </div>

            <div class="panel-box">
                <h3>次のブロック</h3>
                <div class="next-preview" id="nextPreview"></div>
            </div>

            <div class="panel-box controls">
                <button class="btn-start" id="startBtn">ゲーム開始</button>
                <button class="btn-pause" id="pauseBtn">一時停止</button>
            </div>
        </div>

        <div class="game-board-container">
            <div class="game-board" id="gameBoard">
                <div class="game-over-overlay" id="gameOver">
                    <h2>GAME OVER</h2>
                    <p>最終スコア: <span id="finalScore">0</span></p>
                    <button class="btn-start" onclick="startGame()">もう一度プレイ</button>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-box">
                <h3>操作方法</h3>
                <div class="instructions">
                    <p><kbd>←</kbd> <kbd>→</kbd> 左右移動</p>
                    <p><kbd>↓</kbd> 高速落下</p>
                    <p><kbd>Space</kbd> 即座に落下</p>
                    <p><kbd>クリック</kbd> ブロック選択・交換</p>
                </div>
            </div>

            <div class="panel-box">
                <h3>消去ルール</h3>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #667eea, #764ba2);"></div>
                        <span>P社（親会社）</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #11998e, #38ef7d);"></div>
                        <span>S社（子会社）</span>
                    </div>
                    <p style="margin-top: 10px;">
                        <strong>内部取引消去:</strong><br>
                        P社売掛金 + S社買掛金<br>
                        P社売上 + S社仕入<br>
                    </p>
                    <p style="margin-top: 10px;">
                        <strong>投資と資本の相殺:</strong><br>
                        投資勘定 + S社資本<br>
                        → のれん生成！
                    </p>
                </div>
            </div>

            <div class="panel-box">
                <h3>消去ログ</h3>
                <div class="elimination-log" id="eliminationLog"></div>
            </div>
        </div>
    </div>

    <script>
        // ゲーム設定
        const BOARD_WIDTH = 360;
        const BOARD_HEIGHT = 600;
        const BLOCK_WIDTH = 70;
        const BLOCK_HEIGHT = 50;
        const COLUMNS = 5;

        // ブロックタイプ定義
        const BLOCK_TYPES = {
            // P社（親会社）の勘定科目
            P_AR: { company: 'P社', account: '売掛金', type: 'p-company', pair: 'S_AP' },
            P_SALES: { company: 'P社', account: '売上高', type: 'p-company', pair: 'S_COGS' },
            P_LOAN: { company: 'P社', account: '貸付金', type: 'p-company', pair: 'S_BORROWING' },
            P_INVENTORY: { company: 'P社', account: '商品', type: 'p-company', pair: 'S_INVENTORY' },

            // S社（子会社）の勘定科目
            S_AP: { company: 'S社', account: '買掛金', type: 's-company', pair: 'P_AR' },
            S_COGS: { company: 'S社', account: '仕入高', type: 's-company', pair: 'P_SALES' },
            S_BORROWING: { company: 'S社', account: '借入金', type: 's-company', pair: 'P_LOAN' },
            S_INVENTORY: { company: 'S社', account: '商品', type: 's-company', pair: 'P_INVENTORY' },

            // 特殊ブロック
            INVESTMENT: { company: 'P社', account: '子会社株式', type: 'investment', pair: 'EQUITY' },
            EQUITY: { company: 'S社', account: '資本金', type: 'equity', pair: 'INVESTMENT' },
            GOODWILL: { company: '', account: 'のれん', type: 'goodwill', pair: null }
        };

        // ゲーム状態
        let gameState = {
            blocks: [],
            fallingBlock: null,
            nextBlocks: [],
            score: 0,
            level: 1,
            isRunning: false,
            isPaused: false,
            selectedBlock: null,
            fallSpeed: 2,
            lastTime: 0
        };

        const gameBoard = document.getElementById('gameBoard');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('level');
        const nextPreview = document.getElementById('nextPreview');
        const eliminationLog = document.getElementById('eliminationLog');
        const gameOverOverlay = document.getElementById('gameOver');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');

        // ランダムなブロックタイプを取得
        function getRandomBlockType() {
            const types = Object.keys(BLOCK_TYPES).filter(t => t !== 'GOODWILL');
            // 投資と資本は少し出にくくする
            const weights = types.map(t => {
                if (t === 'INVESTMENT' || t === 'EQUITY') return 0.5;
                return 1;
            });
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            let random = Math.random() * totalWeight;

            for (let i = 0; i < types.length; i++) {
                random -= weights[i];
                if (random <= 0) return types[i];
            }
            return types[0];
        }

        // ブロックを生成
        function createBlock(typeKey, x, y) {
            const blockType = BLOCK_TYPES[typeKey];
            const block = document.createElement('div');
            block.className = `block ${blockType.type}`;
            block.innerHTML = `
                <span class="company">${blockType.company}</span>
                <span class="account">${blockType.account}</span>
            `;
            block.style.left = x + 'px';
            block.style.top = y + 'px';
            block.style.height = BLOCK_HEIGHT + 'px';

            block.dataset.typeKey = typeKey;
            block.dataset.x = x;
            block.dataset.y = y;

            block.addEventListener('click', () => handleBlockClick(block));

            return block;
        }

        // 次のブロックをプレビュー表示
        function updateNextPreview() {
            nextPreview.innerHTML = '';
            gameState.nextBlocks.slice(0, 3).forEach(typeKey => {
                const blockType = BLOCK_TYPES[typeKey];
                const preview = document.createElement('div');
                preview.className = `preview-block ${blockType.type}`;
                preview.innerHTML = `${blockType.company} ${blockType.account}`;
                nextPreview.appendChild(preview);
            });
        }

        // 新しい落下ブロックを生成
        function spawnBlock() {
            if (gameState.nextBlocks.length < 5) {
                for (let i = 0; i < 5; i++) {
                    gameState.nextBlocks.push(getRandomBlockType());
                }
            }

            const typeKey = gameState.nextBlocks.shift();
            const column = Math.floor(Math.random() * COLUMNS);
            const x = column * (BOARD_WIDTH / COLUMNS) + (BOARD_WIDTH / COLUMNS - BLOCK_WIDTH) / 2;

            const block = createBlock(typeKey, x, -BLOCK_HEIGHT);
            gameBoard.appendChild(block);

            gameState.fallingBlock = {
                element: block,
                typeKey: typeKey,
                x: x,
                y: -BLOCK_HEIGHT,
                column: column
            };

            updateNextPreview();
        }

        // ブロックの落下処理
        function updateFallingBlock(deltaTime) {
            if (!gameState.fallingBlock) return;

            const block = gameState.fallingBlock;
            const speed = gameState.fallSpeed * (1 + gameState.level * 0.2);
            block.y += speed;

            // 着地判定
            const landingY = findLandingY(block.x);

            if (block.y >= landingY) {
                block.y = landingY;
                block.element.style.top = block.y + 'px';
                landBlock(block);
                return;
            }

            block.element.style.top = block.y + 'px';
        }

        // 着地位置を計算
        function findLandingY(x) {
            let minY = BOARD_HEIGHT - BLOCK_HEIGHT;

            gameState.blocks.forEach(b => {
                const bx = parseFloat(b.dataset.x);
                const by = parseFloat(b.dataset.y);

                if (Math.abs(bx - x) < BLOCK_WIDTH * 0.8) {
                    const landY = by - BLOCK_HEIGHT;
                    if (landY < minY) {
                        minY = landY;
                    }
                }
            });

            return minY;
        }

        // ブロック着地処理
        function landBlock(block) {
            block.element.dataset.x = block.x;
            block.element.dataset.y = block.y;
            gameState.blocks.push(block.element);
            gameState.fallingBlock = null;

            // ゲームオーバー判定
            if (block.y < 0) {
                gameOver();
                return;
            }

            // 消去チェック
            setTimeout(() => {
                checkEliminations();
                setTimeout(spawnBlock, 300);
            }, 100);
        }

        // 消去判定
        function checkEliminations() {
            let eliminated = false;
            const toRemove = [];
            const goodwillPositions = [];

            for (let i = 0; i < gameState.blocks.length; i++) {
                for (let j = i + 1; j < gameState.blocks.length; j++) {
                    const block1 = gameState.blocks[i];
                    const block2 = gameState.blocks[j];

                    if (toRemove.includes(block1) || toRemove.includes(block2)) continue;

                    const x1 = parseFloat(block1.dataset.x);
                    const y1 = parseFloat(block1.dataset.y);
                    const x2 = parseFloat(block2.dataset.x);
                    const y2 = parseFloat(block2.dataset.y);

                    // 隣接判定（上下左右）
                    const isAdjacent = (
                        (Math.abs(x1 - x2) < BLOCK_WIDTH * 1.2 && Math.abs(y1 - y2) < 10) ||
                        (Math.abs(y1 - y2) < BLOCK_HEIGHT * 1.2 && Math.abs(x1 - x2) < 10)
                    );

                    if (isAdjacent) {
                        const type1 = block1.dataset.typeKey;
                        const type2 = block2.dataset.typeKey;

                        // ペア判定
                        if (BLOCK_TYPES[type1].pair === type2) {
                            toRemove.push(block1, block2);
                            eliminated = true;

                            // 投資と資本の相殺 → のれん生成
                            if ((type1 === 'INVESTMENT' && type2 === 'EQUITY') ||
                                (type1 === 'EQUITY' && type2 === 'INVESTMENT')) {
                                goodwillPositions.push({
                                    x: (x1 + x2) / 2,
                                    y: Math.min(y1, y2)
                                });
                                addLog('投資と資本の相殺 → のれん生成！', true);
                                showComboText('のれん生成！');
                                gameState.score += 500;
                            } else {
                                const account1 = BLOCK_TYPES[type1].account;
                                const account2 = BLOCK_TYPES[type2].account;
                                addLog(`${account1} × ${account2} 消去！`);
                                gameState.score += 100;
                            }
                        }
                    }
                }
            }

            // ブロック削除とエフェクト
            toRemove.forEach(block => {
                showEliminationEffect(block);
                block.remove();
                const index = gameState.blocks.indexOf(block);
                if (index > -1) {
                    gameState.blocks.splice(index, 1);
                }
            });

            // のれんブロック生成
            goodwillPositions.forEach(pos => {
                setTimeout(() => {
                    const goodwill = createBlock('GOODWILL', pos.x, pos.y);
                    gameBoard.appendChild(goodwill);
                    gameState.blocks.push(goodwill);
                }, 500);
            });

            // 落下処理
            if (eliminated) {
                setTimeout(() => {
                    applyGravity();
                    updateScore();
                    checkLevelUp();
                }, 300);
            }
        }

        // 重力適用（浮いているブロックを落とす）
        function applyGravity() {
            let moved = true;
            while (moved) {
                moved = false;
                gameState.blocks.forEach(block => {
                    const x = parseFloat(block.dataset.x);
                    const y = parseFloat(block.dataset.y);
                    const landingY = findLandingYForExisting(block, x);

                    if (y < landingY) {
                        block.dataset.y = landingY;
                        block.style.top = landingY + 'px';
                        moved = true;
                    }
                });
            }

            // 重力適用後に再度消去チェック
            setTimeout(checkEliminations, 200);
        }

        function findLandingYForExisting(currentBlock, x) {
            let minY = BOARD_HEIGHT - BLOCK_HEIGHT;

            gameState.blocks.forEach(b => {
                if (b === currentBlock) return;
                const bx = parseFloat(b.dataset.x);
                const by = parseFloat(b.dataset.y);

                if (Math.abs(bx - x) < BLOCK_WIDTH * 0.8) {
                    const landY = by - BLOCK_HEIGHT;
                    if (landY < minY) {
                        minY = landY;
                    }
                }
            });

            return minY;
        }

        // エフェクト表示
        function showEliminationEffect(block) {
            const effect = document.createElement('div');
            effect.className = 'elimination-effect';
            effect.textContent = '消去！';
            effect.style.left = block.style.left;
            effect.style.top = block.style.top;
            gameBoard.appendChild(effect);

            setTimeout(() => effect.remove(), 800);
        }

        function showComboText(text) {
            const combo = document.createElement('div');
            combo.className = 'combo-text';
            combo.textContent = text;
            gameBoard.appendChild(combo);

            setTimeout(() => combo.remove(), 1000);
        }

        // ログ追加
        function addLog(message, isGoodwill = false) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${isGoodwill ? 'goodwill' : ''}`;
            entry.textContent = message;
            eliminationLog.insertBefore(entry, eliminationLog.firstChild);

            // 古いログを削除
            while (eliminationLog.children.length > 10) {
                eliminationLog.removeChild(eliminationLog.lastChild);
            }
        }

        // スコア更新
        function updateScore() {
            scoreDisplay.textContent = gameState.score;
        }

        // レベルアップチェック
        function checkLevelUp() {
            const newLevel = Math.floor(gameState.score / 500) + 1;
            if (newLevel > gameState.level) {
                gameState.level = newLevel;
                levelDisplay.textContent = gameState.level;
                showComboText(`Level ${gameState.level}!`);
            }
        }

        // ブロッククリック処理
        function handleBlockClick(block) {
            if (!gameState.isRunning || gameState.isPaused) return;
            if (gameState.fallingBlock && gameState.fallingBlock.element === block) return;

            if (gameState.selectedBlock) {
                if (gameState.selectedBlock === block) {
                    block.style.outline = 'none';
                    gameState.selectedBlock = null;
                } else {
                    // ブロック交換
                    swapBlocks(gameState.selectedBlock, block);
                    gameState.selectedBlock.style.outline = 'none';
                    gameState.selectedBlock = null;
                }
            } else {
                gameState.selectedBlock = block;
                block.style.outline = '3px solid #fff';
            }
        }

        // ブロック交換
        function swapBlocks(block1, block2) {
            const x1 = block1.dataset.x;
            const y1 = block1.dataset.y;
            const x2 = block2.dataset.x;
            const y2 = block2.dataset.y;

            // 隣接チェック
            const dx = Math.abs(parseFloat(x1) - parseFloat(x2));
            const dy = Math.abs(parseFloat(y1) - parseFloat(y2));

            if ((dx < BLOCK_WIDTH * 1.5 && dy < 10) || (dy < BLOCK_HEIGHT * 1.5 && dx < 10)) {
                block1.dataset.x = x2;
                block1.dataset.y = y2;
                block1.style.left = x2 + 'px';
                block1.style.top = y2 + 'px';

                block2.dataset.x = x1;
                block2.dataset.y = y1;
                block2.style.left = x1 + 'px';
                block2.style.top = y1 + 'px';

                setTimeout(checkEliminations, 100);
            }
        }

        // キーボード操作
        document.addEventListener('keydown', (e) => {
            if (!gameState.isRunning || gameState.isPaused || !gameState.fallingBlock) return;

            const block = gameState.fallingBlock;
            const columnWidth = BOARD_WIDTH / COLUMNS;

            switch (e.key) {
                case 'ArrowLeft':
                    if (block.column > 0) {
                        block.column--;
                        block.x = block.column * columnWidth + (columnWidth - BLOCK_WIDTH) / 2;
                        block.element.style.left = block.x + 'px';
                    }
                    break;
                case 'ArrowRight':
                    if (block.column < COLUMNS - 1) {
                        block.column++;
                        block.x = block.column * columnWidth + (columnWidth - BLOCK_WIDTH) / 2;
                        block.element.style.left = block.x + 'px';
                    }
                    break;
                case 'ArrowDown':
                    gameState.fallSpeed = 10;
                    break;
                case ' ':
                    // 即座に落下
                    const landingY = findLandingY(block.x);
                    block.y = landingY;
                    block.element.style.top = block.y + 'px';
                    landBlock(block);
                    break;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowDown') {
                gameState.fallSpeed = 2;
            }
        });

        // ゲームループ
        function gameLoop(timestamp) {
            if (!gameState.isRunning) return;

            const deltaTime = timestamp - gameState.lastTime;
            gameState.lastTime = timestamp;

            if (!gameState.isPaused) {
                updateFallingBlock(deltaTime);
            }

            requestAnimationFrame(gameLoop);
        }

        // ゲーム開始
        function startGame() {
            // リセット
            gameState.blocks.forEach(b => b.remove());
            gameState.blocks = [];
            gameState.fallingBlock = null;
            gameState.nextBlocks = [];
            gameState.score = 0;
            gameState.level = 1;
            gameState.selectedBlock = null;
            gameState.fallSpeed = 2;

            eliminationLog.innerHTML = '';
            updateScore();
            levelDisplay.textContent = '1';
            gameOverOverlay.classList.remove('show');

            gameState.isRunning = true;
            gameState.isPaused = false;
            gameState.lastTime = performance.now();

            spawnBlock();
            requestAnimationFrame(gameLoop);
        }

        // ゲームオーバー
        function gameOver() {
            gameState.isRunning = false;
            document.getElementById('finalScore').textContent = gameState.score;
            gameOverOverlay.classList.add('show');
        }

        // 一時停止
        function togglePause() {
            if (!gameState.isRunning) return;
            gameState.isPaused = !gameState.isPaused;
            pauseBtn.textContent = gameState.isPaused ? '再開' : '一時停止';
        }

        // イベントリスナー
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);

        // 初期化
        updateNextPreview();
    </script>
</body>
</html>
